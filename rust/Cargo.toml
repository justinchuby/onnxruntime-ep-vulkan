# `xtask` is the local CI-parity runner (`cargo ci`). It is a workspace member so that
# `cargo run --package xtask` resolves without a `--manifest-path`, and it is excluded from
# `default-members` so that a bare `cargo build` / `cargo test` here still means "the EP crate"
# and nothing else — including in CI, which invokes `--manifest-path rust/Cargo.toml`.
[workspace]
members = ["xtask"]
default-members = ["."]

[package]
name = "onnxruntime-ep-vulkan"
version = "0.28.0"
edition = "2024"
rust-version = "1.85"
description = "Cross-platform Vulkan compute execution provider (plugin EP) for ONNX Runtime."
license = "MIT"
repository = "https://github.com/justinchuby/onnxruntime-ep-vulkan"
readme = "README.md"
keywords = ["onnx", "onnxruntime", "vulkan", "gpu", "compute"]
categories = ["science", "api-bindings", "hardware-support"]

[lib]
# Pin the lib (and therefore cdylib) base name so the artifact is always
# `onnxruntime_vulkan_ep.dll` / `libonnxruntime_vulkan_ep.so` / `.dylib` regardless of the crate
# name -- the Python package, the pytest suite, CI and any downstream host load the plugin by that
# exact filename (DESIGN.md 3.1).
#
# `rlib` is present alongside `cdylib` on purpose: without it, `cargo test` cannot link the crate
# into an integration-test binary, and the layering lint plus the sys-binding assertions are
# integration tests. It costs a second codegen pass and nothing at runtime.
name = "onnxruntime_vulkan_ep"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Logging facade only. The in-crate `logging` module installs the (tiny) subscriber. A cdylib has
# its own statically linked copy of `log`, so installing a logger here can never conflict with
# whatever the host process uses.
log = { version = "0.4", features = ["std"] }

# --- Vulkan stack (decisions.md: "Rust Vulkan crate: ash + gpu-allocator") ------------------
#
# Declared now so the dependency decision is recorded in the manifest and the lockfile from M0.
# `engine.rs` currently only names them (`use ash as _;`) -- Switch wires the real engine in.
#
# `ash` is loaded dynamically at runtime via `ash::Entry::load()`; there is NO build-time or
# link-time dependency on the Vulkan SDK or on `vulkan-1.lib`. A machine with no Vulkan loader
# gets an `Err` from `Entry::load()`, which the EP turns into "zero devices advertised", not a
# link error and not a crash (DESIGN.md 2.3).
ash = { version = "0.38", default-features = false, features = ["loaded"] }
gpu-allocator = { version = "0.27", default-features = false, features = ["vulkan"] }

# --- Observability (Niobe; mirrors `onnxruntime-mlx/rust/Cargo.toml`) -----------------------
#
# Pure-Rust Chrome/Perfetto tracer, from crates.io — Justin's own crate, the same one the MLX EP
# uses. `default-features = false` drops the `perfetto` (prost) feature: we export Chrome Trace
# JSON only, which keeps a plugin dylib free of a protobuf codegen dependency.
#
# Pinned to a release with the **absolute UNIX-microsecond clock**, and the pin is the point.
# A plugin cdylib has its own statically linked copy of this crate and its own statics, so it
# could never share a process-global epoch with the host's copy. Because the clock is absolute
# rather than process-relative, both copies report the same instant as the same number — which is
# what lets a trace emitted from inside this plugin be laid directly over a host trace (or over
# the MLX EP's trace) with no offset to negotiate. Moving off this pin without re-checking that
# property silently breaks trace overlay, and the breakage looks like "the GPU work happened at a
# different time", not like a version bump.
onnx-runtime-tracer = { version = "0.1.0-dev.5", default-features = false }

[dev-dependencies]
# `tests/cdylib_load.rs` loads the *shipped* cdylib by path and resolves `CreateEpFactories` /
# `ReleaseEpFactory` by name, exactly as ONNX Runtime does. Test-only: the plugin itself is never
# the one doing the loading, so this never ships.
libloading = "0.8"

[build-dependencies]# Generates the ORT plugin-EP C ABI bindings from the vendored headers in
# `third_party/onnxruntime/include`. See `rust/README.md` for the bindgen-vs-handwritten rationale.
bindgen = "0.72"

[profile.release]
# Unwind (NOT abort) so a Rust panic can be caught at every C-ABI boundary and converted into an
# `OrtStatus` (see `guard_ffi_status` in lib.rs). A plugin loaded into someone else's process must
# degrade to an error status, never take the host down, and must never unwind into ORT's C++
# (which is undefined behaviour). `panic = "abort"` would make the guards unable to do their job.
panic = "unwind"

[profile.dev]
panic = "unwind"
