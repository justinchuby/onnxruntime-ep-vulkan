name: conformance (onnx-tests)

# Opt-in ONLY. Fuzz-conformance of the Vulkan EP against the ONNX standard using
# cbourjau/onnx-tests. This is deliberately NOT wired into the required CI (ci.yml):
# it depends on pixi + network + a full cargo build and is too heavy/flaky to gate PRs.
# Trigger it by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      max_examples:
        description: "Hypothesis max_examples per test (bounded fuzzing)"
        default: "20"
        required: false
      seed:
        description: "Hypothesis seed (reproducible sampling)"
        default: "0"
        required: false
      ops:
        description: "Optional space-separated op subset (blank = full claimed set from claimed_ops.txt)"
        default: ""
        required: false

jobs:
  conformance:
    name: onnx-tests vs Vulkan EP (Linux, lavapipe)
    runs-on: ubuntu-22.04
    env:
      ORT_VERSION: "1.28.0"
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (rustup, no third-party action)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version && cargo --version

      - name: Install Vulkan SDK (lavapipe + validation layers + glslc)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libvulkan-dev vulkan-validationlayers mesa-vulkan-drivers \
            glslang-tools spirv-tools vulkan-tools

      - name: Provision ONNX Runtime ${{ env.ORT_VERSION }}
        run: |
          curl -fsSL \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz" \
            | tar xz
          echo "ORT_HOME=$PWD/onnxruntime-linux-x64-${ORT_VERSION}" >> "$GITHUB_ENV"

      - name: Build Vulkan EP (cargo build --release)
        run: |
          if [ ! -f rust/Cargo.toml ]; then
            echo "::error::rust/Cargo.toml not found — build the EP crate first"
            exit 1
          fi
          ORT_INCLUDE_DIR="$ORT_HOME/include" \
            cargo build --release --manifest-path rust/Cargo.toml
          echo "VULKAN_EP_LIB=$PWD/rust/target/release/libonnxruntime_vulkan_ep.so" \
            >> "$GITHUB_ENV"

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Clone + install onnx-tests (sibling), pin onnxruntime 1.27
        run: |
          git clone --depth 1 https://github.com/cbourjau/onnx-tests ../onnx-tests
          (cd ../onnx-tests && pixi run postinstall)
          # EP requires ORT_API_VERSION 27; the pixi env may ship an older ort.
          (cd ../onnx-tests && pixi run python -m pip install "onnxruntime==${ORT_VERSION}")
          echo "ONNX_TESTS_DIR=$PWD/../onnx-tests" >> "$GITHUB_ENV"

      - name: Run bounded conformance subset (pytest-driven)
        # `continue-on-error` and `|| true` are deliberate HERE and only here: this is a
        # census of what onnx-tests says about claimed ops, not a gate. Its output is a
        # diagnostic and may not be quoted as evidence — it carries no
        # model_output_equivalence verdict and therefore no attribution, which under
        # DESIGN.md §10.0 means it reports nothing about this EP. The gate steps below
        # are what make the lane's own health readable, and they are NOT
        # continue-on-error.
        continue-on-error: true
        env:
          VULKAN_EP_LIB: ${{ env.VULKAN_EP_LIB }}
          ONNX_TESTS_DIR: ${{ env.ONNX_TESTS_DIR }}
          ORT_LIB_DIR: ${{ env.ORT_HOME }}/lib
          MAX_EXAMPLES: ${{ github.event.inputs.max_examples }}
          SEED: ${{ github.event.inputs.seed }}
          OPS: ${{ github.event.inputs.ops }}
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          python3 -m pip install --quiet pytest
          export LD_LIBRARY_PATH="$ORT_HOME/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python3 -m pytest tests/conformance/test_conformance.py -v \
            --junitxml=tests/conformance/conformance-junit.xml \
            2>&1 | tee tests/conformance/conformance.out || true
          {
            echo "### onnx-tests conformance (Vulkan EP, lavapipe)"
            echo "_Diagnostic only. No verdict, no attribution — not evidence (DESIGN.md §10.0)._"
            echo '```'
            tail -n 40 tests/conformance/conformance.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # -------------------------------------------------------
      # CRITERION 10 — the same gate the CI lanes carry, so that a
      # conformance run is at least attributable. Without it, a
      # conformance table is a report about whichever executor
      # happened to run the graph, and on 2026-07-30 that was CPU
      # for a whole day without anything saying so.
      # -------------------------------------------------------
      - name: Verdict vocabulary preflight (which kind of instrument outage?)
        # Distinguishes "this checkout does not carry tests/ops/_verdict.py" (repository
        # state) from "the file is here and this job cannot import it" (lane defect).
        # Without it both appear as ERROR(instrument=verdict_vocabulary_unavailable) in
        # every step below and the difference is invisible.
        run: python3 ci/check_vocabulary.py --github-summary

      - name: Criterion 10 gate artifact (gate_chain_fp32, lavapipe)
        env:
          ONNXRUNTIME_VULKAN_EP_LIB: ${{ env.VULKAN_EP_LIB }}
          ONNXRUNTIME_EP_VULKAN_COUNTERS_FILE: ${{ github.workspace }}/bench/results/ci-lane/counters-conformance.json
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          export LD_LIBRARY_PATH="$ORT_HOME/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python3 -m pip install --quiet numpy onnx
          mkdir -p bench/results/ci-lane
          python3 ci/gate_chain_fp32.py \
            --verdict-out bench/results/ci-lane/verdict-conformance.json \
            --workdir bench/results/ci-lane

      - name: Criterion 10 verdict gate (independent reader)
        run: python3 ci/check_verdict.py bench/results/ci-lane/verdict-conformance.json

      # The falsifier for this lane's own gate: loader untouched, an artifact the EP
      # declines, and the lane must go red. Without it the conformance lane carries a
      # gate that has only ever been observed passing (R9).
      - name: Gate negative control — a declined artifact must produce UNATTRIBUTED
        env:
          ONNXRUNTIME_VULKAN_EP_LIB: ${{ env.VULKAN_EP_LIB }}
          ONNXRUNTIME_EP_VULKAN_COUNTERS_FILE: ""
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          export LD_LIBRARY_PATH="$ORT_HOME/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          set +e
          out=$(python3 ci/gate_chain_fp32.py --artifact decline_probe \
            --verdict-out bench/results/ci-lane/negative-control-decline.json \
            --workdir bench/results/ci-lane 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "::error::NEGATIVE CONTROL FAILED: the gate passed on an artifact the EP is supposed to decline. Either the EP now claims that op and this control has silently stopped being one, or the gate cannot tell execution from non-execution."
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q 'FAIL(condition=UNATTRIBUTED)'; then
            echo "::error::NEGATIVE CONTROL FAILED: the gate exited $code on the declined artifact but did not report FAIL(condition=UNATTRIBUTED). An instrument error is not a detection (R13)."
            exit 1
          fi
          echo "NEGATIVE CONTROL PASSED (loader untouched): the gate reported FAIL(condition=UNATTRIBUTED) and exited $code."

      - name: Known-fatal log line is a lane failure (R13 second witness)
        if: always()
        run: |
          python3 ci/check_fatal_log.py \
            tests/conformance/conformance.out \
            bench/results/ci-lane/gate_chain_fp32_ort_stderr.log

      - name: No duration without a device-state record (§10.0 obligation 8)
        # See .github/workflows/ci.yml for the full rationale. Short form: a variance
        # test over a suffix cannot see a bias, so `STEADY` does not make a device-clock
        # figure quotable — a device-state record over the statistic's own suffix does.
        # This lane quotes no timing figure, and this step is what keeps that true by
        # construction. lavapipe has no device clock at all, so a certified device-clock
        # figure is not merely absent here but unavailable in principle
        # (ci/device_state.py :: lavapipe_note).
        if: always()
        run: |
          python3 ci/check_device_state.py \
            --scan bench/results/ci-lane \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: |
            tests/conformance/conformance-junit.xml
            tests/conformance/conformance.out
            tests/conformance/results.csv
            tests/conformance/logs/
            bench/results/ci-lane/
          if-no-files-found: warn
