name: CI

# Triggers: every push to main and every pull request.
on:
  push:
    branches: [main]
  pull_request:

# ------------------------------------------------------------------
# Version pins — change here, nowhere else.
# ------------------------------------------------------------------
# ORT_VERSION: compile and test against ORT 1.28 (released 2026-07-24).
#   DO NOT use 1.27: it contains a null-allocator PrePack bug and a
#   deleter lifetime issue in the plugin-EP path, fixed in 1.28.
#   Source: .squad/decisions/inbox/fact-checker-ort-1.28-api.md
#
# MESA_VERSION (Windows only): lavapipe via mesa-dist-win.
#   mesa3d-{ver}-release-msvc.7z ships lavapipe (Vulkan 1.3 CPU
#   software rasterizer) as a self-contained Windows DLL + ICD JSON.
#   Source: https://github.com/pal1000/mesa-dist-win (26.1.3 = latest
#   stable as of 2026-07-28).
# ------------------------------------------------------------------
env:
  ORT_VERSION: "1.28.0"
  MESA_VERSION: "26.1.3"
  # LunarG SDK version used on both Linux (apt repo) and Windows (installer).
  # The Linux apt repo uses a three-part version (strip the trailing .0).
  VULKAN_SDK_VERSION: "1.3.296.0"
  # ONNX minimum version — must match the floor in tests/requirements.txt.
  # onnx 1.22 contains a WRONG Attention-24 reference implementation (Justin Chu,
  # ONNX owner, confirmed: fix correct semantics, no opset bump). The fixed semantics
  # will ship in a forthcoming onnx release; this pin prevents silent oracle drift.
  # TODO(Fact Checker): update to the fixed-semantics release once confirmed.
  ONNX_MIN_VERSION: "1.22.0"

# ------------------------------------------------------------------
# CI lanes:
#   format          : rustfmt check (ubuntu, fast, no build)
#   lane-checks     : two-polarity self-test of the gate readers in
#                     ci/ — no Vulkan, no GPU, no ORT session
#   build-test-linux: cargo build + clippy + op tests (lavapipe)
#                     + validation layers (zero errors enforced)
#                     + layering lint + CRITERION 10 GATE
#   build-test-windows: cargo build + clippy + op tests (lavapipe
#                     via mesa-dist-win) + no-ICD fallback test
#                     + validation layers via LunarG SDK
#                     + CRITERION 10 GATE
#
# WHAT A GREEN LANE MEANS HERE, AND WHAT IT MEANT BEFORE 2026-07-31:
#   Before: the pytest process exited zero. That is all it meant, and
#   on 2026-07-30 it was true for most of a day while this EP executed
#   ZERO nodes and ORT silently re-ran everything on CPU.
#   Now: the lane additionally carries a gate artifact (gate_chain_fp32,
#   docs/PLATFORMS.md §7.8) whose pass condition includes the
#   model_output_equivalence VERDICT — so a run that did not measure
#   reports UNMEASURED, a run in which this EP executed nothing reports
#   UNATTRIBUTED, and neither of those is a pass. Each lane also runs a
#   NEGATIVE CONTROL that removes the ICD and requires the gate to go
#   red, because a check observed only to pass is not known to be a check.
#
#   `continue-on-error` appears NOWHERE in this file, and no verdict-bypass
#   flag does either (one exists for local debugging; it is deliberately not
#   spelled out here so that a grep for it in this file finds nothing).
#   Absence of a check is a refusal, not a default green — the same
#   principle bench/admissible.py carries for Niobe.
# ------------------------------------------------------------------

jobs:

  # ----------------------------------------------------------------
  # 1. Format check (fast, no build, no Vulkan SDK needed)
  # ----------------------------------------------------------------
  format:
    name: rustfmt check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (rustup, no third-party action)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable
          cargo fmt --version

      - name: Check formatting
        # The rust/ crate may not exist yet if Tank hasn't landed it.
        # Exit 0 with a warning rather than breaking CI on a missing crate.
        run: |
          if [ -f rust/Cargo.toml ]; then
            cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          else
            echo "::warning::rust/Cargo.toml not found — format check skipped (crate not yet landed)"
          fi

  # ----------------------------------------------------------------
  # 2. Lane-check self-test (no Vulkan, no GPU, no ORT session)
  # ----------------------------------------------------------------
  # The lanes below gate on ci/check_verdict.py and ci/check_fatal_log.py.
  # Those are instruments, and R9 says evidence scales only with
  # falsifying instruments — so the instruments themselves need a
  # falsifier, and it must run where the thing they check is broken
  # or absent. Hence: synthesised verdict records and synthesised
  # logs, both polarities, asserting the printed TOKEN and not only
  # the exit code (R13: two different things spelled the same way
  # are not a signal).
  #
  # This job needs no Vulkan and no GPU on purpose. If it needed the
  # subject under test to be healthy, it could not tell us anything
  # on the day the subject is sick, which is the only day it matters.
  # ----------------------------------------------------------------
  lane-checks:
    name: Lane-check self-test (two polarities, no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest onnx numpy

      - name: Verdict vocabulary preflight (which kind of instrument outage?)
        # This job's tests fail COLLECTION when tests/ops/_verdict.py is missing, which
        # is correct (a skip reports the same green as a pass) and unreadable on its own:
        # a collection error looks the same whether the vocabulary is legitimately absent
        # from this checkout or the job is broken. This step answers that first, by
        # token, and puts the answer in the job summary.
        run: python ci/check_vocabulary.py --github-summary

      - name: Two-polarity tests for ci/ lane checks
        run: python -m pytest ci/test_lane_checks.py -q -p no:randomly

  # ----------------------------------------------------------------
  # 3. Linux: build + clippy + op tests (lavapipe GPU-less lane)
  #    + criterion 10 gate artifact + negative control
  # ----------------------------------------------------------------
  build-test-linux:
    name: Build + op tests (Linux, lavapipe)
    runs-on: ubuntu-22.04
    env:
      # Force Vulkan loader to use lavapipe exclusively.
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      ONNXRUNTIME_EP_VULKAN_VALIDATE: "1"
      # VK_INSTANCE_LAYERS moved to the pytest step so the lavapipe smoke-check
      # gets a clean baseline enumeration (per docs/PLATFORMS.md §7.4.2 Fix 2:
      # setting it at job level can cause vkCreateInstance to fail if the layer
      # path is not yet configured, masking lavapipe as the real problem).
      VK_LOADER_DEBUG: warn

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (rustup, no third-party action)
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt,clippy --no-self-update
          rustup default stable
          rustc --version && cargo --version

      # -------------------------------------------------------
      # LunarG Vulkan SDK apt repository — provides glslc (shaderc).
      #
      # Ubuntu 22.04's own repos do NOT contain shaderc or glslc.
      # The LunarG apt repository for Jammy does, via the 'shaderc'
      # package which installs /usr/bin/glslc.
      #
      # Version pin: the list file URL includes the SDK minor version
      # (e.g. 1.3.296) so this does not silently pick up a new SDK.
      # To bump: update VULKAN_SDK_VERSION at the workflow level.
      # -------------------------------------------------------
      - name: Add LunarG Vulkan SDK apt repository
        run: |
          set -euo pipefail
          # Strip trailing .0 for the versioned repo URL (1.3.296.0 → 1.3.296)
          SDK_SHORT="${VULKAN_SDK_VERSION%.*}"
          # Fetch the LunarG signing key into the modern keyring location.
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/lunarg-signing-key.gpg
          # Write our OWN .list entry referencing that keyring.
          # We do NOT use LunarG's versioned .list file verbatim because it
          # does not contain a signed-by= clause, so apt can't verify it —
          # that is the root cause of the NO_PUBKEY AA8452080E383F7E error.
          echo "deb [signed-by=/usr/share/keyrings/lunarg-signing-key.gpg] https://packages.lunarg.com/vulkan/${SDK_SHORT} jammy main" \
            | sudo tee /etc/apt/sources.list.d/lunarg-vulkan-jammy.list > /dev/null
          sudo apt-get update -q
          echo "LunarG apt repo added (SDK ${SDK_SHORT}, signed-by= set)"

      # -------------------------------------------------------
      # Vulkan SDK: lavapipe (Mesa CPU rasterizer), validation
      # layers, GLSL compiler (glslc), spirv-tools.
      #
      # glslc comes from the LunarG repo (added above) via the
      # 'shaderc' package — NOT from Ubuntu's own repos, which
      # do not ship shaderc. Previous rounds tried 'glslang-tools'
      # (provides glslangValidator only) and then 'shaderc' from
      # Ubuntu repos (package does not exist). The LunarG repo
      # is the definitive source for glslc on Ubuntu 22.04.
      #
      # 'shaderc' (LunarG repo) → /usr/bin/glslc
      # 'glslang-tools' (Ubuntu) → /usr/bin/glslangValidator (kept)
      # Ubuntu 22.04 ships Mesa 22.0, Vulkan 1.3.
      # -------------------------------------------------------
      - name: Install Vulkan SDK (lavapipe + validation layers)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libvulkan-dev \
            vulkan-validationlayers \
            mesa-vulkan-drivers \
            shaderc \
            glslang-tools \
            spirv-tools \
            vulkan-tools
            # Refresh linker cache — LunarG packages may install SOs to a path
            # not yet visible to the dynamic linker.
            sudo ldconfig
            # Smoke-check: lavapipe must enumerate cleanly before we waste build time.
            # VK_INSTANCE_LAYERS is intentionally absent here (moved to test step)
            # to get a clean baseline that reflects Mesa installation, not layer config.
            # 'llvmpipe' is lavapipe's reported device name. Hard failure if absent.
            VK_LOADER_DEBUG=warn VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
              vulkaninfo --summary 2>&1 | tee /dev/stderr | grep -qi "llvmpipe" || {
              echo "::error::lavapipe not enumerated by vulkaninfo — mesa-vulkan-drivers may not be installed or the LunarG loader upgrade broke the ICD path. Check above loader debug output."
              exit 1
            }
            echo "lavapipe smoke-check: OK (llvmpipe enumerated)"

      # -------------------------------------------------------
      # Precondition check: verify the GLSL compiler is actually
      # on PATH before the build starts. A build that fails 40s
      # later inside build.rs with a panic is a much worse
      # diagnostic than this explicit check.
      # -------------------------------------------------------
      - name: Verify GLSL compiler (glslc)
        run: |
          glslc --version || {
            echo "::error::glslc not found on PATH after installing 'shaderc'."
            echo "Package contents:"
            dpkg -L shaderc 2>/dev/null || true
            echo "PATH: $PATH"
            exit 1
          }
          echo "glslc OK: $(glslc --version 2>&1 | head -1)"

      # -------------------------------------------------------
      # ONNX Runtime: download the prebuilt Linux x64 package.
      # The EP crate's build.rs needs ORT headers for FFI bindings.
      # -------------------------------------------------------
      - name: Provision ONNX Runtime ${{ env.ORT_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz" \
            | tar xz
          echo "ORT_HOME=$PWD/onnxruntime-linux-x64-${ORT_VERSION}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade \
            "onnxruntime==${ORT_VERSION}" \
            "onnx>=${ONNX_MIN_VERSION}" \
            numpy onnx_ir pytest onnx-shape-inference

      # -------------------------------------------------------
      # Build the EP crate. Fails cleanly with a clear message
      # if the crate skeleton hasn't landed yet (Tank's work).
      # -D warnings: warning-clean is a CI requirement.
      # -------------------------------------------------------
      - name: Build Vulkan EP (cargo build --release)
        run: |
          if [ ! -f rust/Cargo.toml ]; then
            echo "::warning::rust/Cargo.toml not found — EP crate not yet landed (Tank's work in progress)"
            echo "BUILD_SKIPPED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          ORT_INCLUDE_DIR="$ORT_HOME/include" \
          RUSTFLAGS="-D warnings" \
            cargo build --release --manifest-path rust/Cargo.toml
          # Verify the cdylib was produced
          test -f rust/target/release/libonnxruntime_vulkan_ep.so || {
            echo "::error::cdylib not found after build — check [lib] crate-type in Cargo.toml"
            exit 1
          }
          echo "ONNXRUNTIME_VULKAN_EP_LIB=$PWD/rust/target/release/libonnxruntime_vulkan_ep.so" \
            >> "$GITHUB_ENV"

      - name: Clippy (all warnings as errors)
        if: env.BUILD_SKIPPED != '1'
        run: |
          ORT_INCLUDE_DIR="$ORT_HOME/include" \
            cargo clippy --release --manifest-path rust/Cargo.toml \
            --all-targets -- -D warnings

      # -------------------------------------------------------
      # Layering lint — Tank's integration test (cargo test --test layering).
      # Tests are in rust/tests/layering.rs and verify that ops code never
      # imports from sys::, ORT C ABI, ash::, vk::, or uses unsafe.
      # -------------------------------------------------------
      - name: Layering lint (cargo test --test layering)
        if: env.BUILD_SKIPPED != '1'
        run: |
          if [ ! -f rust/Cargo.toml ]; then
            echo "::notice::rust/Cargo.toml not found — layering lint skipped"
            exit 0
          fi
          ORT_INCLUDE_DIR="$ORT_HOME/include" \
            cargo test --test layering --manifest-path rust/Cargo.toml

      # -------------------------------------------------------
      # Rust unit tests — 440 of them, and until 2026-08-01 NONE of
      # them had ever run in CI. The only cargo test in either lane
      # was --test layering, one integration target out of six.
      #
      # This is not a completeness gesture. lavapipe reports
      # timestampPeriod = 1.0, exactly as NVIDIA does, so a build
      # that drops the period conversion is NUMERICALLY IDENTICAL on
      # every device CI can reach while under-reporting Intel Iris Xe
      # by 52.0833x. No execution on the CI device can see that. The
      # trace.rs unit tests can, because they construct a SYNTHETIC
      # calibration with a non-unit period and never touch a device.
      #
      # Falsified 2026-08-01: dropping both period multiplies in
      # trace.rs turns four of these red, including
      #   treating_intel_ticks_as_nanoseconds_is_wrong_by_fifty_two_times
      #   'period scaling not applied: 100000 ns for 100000 ticks'
      # See ci/lane_inventory.py :: BLIND_SPOTS['timestamp_period_52x'].
      #
      # Default parallelism deliberately. Running with --test-threads=1
      # would hide cross-test state leakage, which is a defect and not
      # a test-runner setting.
      # -------------------------------------------------------
      - name: Rust unit tests (cargo test --lib)
        if: env.BUILD_SKIPPED != '1'
        run: |
          ORT_INCLUDE_DIR="$ORT_HOME/include" \
            cargo test --lib --release --manifest-path rust/Cargo.toml

      # -------------------------------------------------------
      # Portability lint — rule P1: a platform-conditional binding
      # named without a cfg gate. In the lint's own words, "the class
      # of bug that only shows up on a CI lane for another OS, hours
      # later, while blocking everything behind it". It has existed in
      # rust/tests/portability.rs and had never been run by CI.
      # -------------------------------------------------------
      - name: Portability lint (cargo test --test portability)
        if: env.BUILD_SKIPPED != '1'
        run: |
          ORT_INCLUDE_DIR="$ORT_HOME/include" \
            cargo test --test portability --release --manifest-path rust/Cargo.toml

      # -------------------------------------------------------
      # The remaining integration targets, also never run in CI.
      # -------------------------------------------------------
      - name: Remaining integration targets (cdylib_load, dump_capabilities, host_registration, validation_control)
        if: env.BUILD_SKIPPED != '1'
        run: |
          ORT_INCLUDE_DIR="$ORT_HOME/include" \
            cargo test --release --manifest-path rust/Cargo.toml \
            --test cdylib_load --test dump_capabilities \
            --test host_registration --test validation_control

      # -------------------------------------------------------
      # Probe Vulkan loader — hard failure if no capable device.
      # Switch built epctl for exactly this purpose: a standalone
      # Vulkan probe that needs no ONNX Runtime and exits non-zero
      # when no capable device is found. This turns "tests all
      # skipped for some reason" into a named red step that says why.
      # -------------------------------------------------------
      - name: Probe Vulkan loader (epctl --probe-loader)
        if: env.BUILD_SKIPPED != '1'
        run: rust/target/release/epctl --probe-loader

      # -------------------------------------------------------
      # Op-correctness tests (pytest, Vulkan vs ORT CPU oracle).
      # Includes:
      #   - test_op_table.py    : claim + CPU oracle (124 cases)
      #   - test_barrier_parity.py : sync2/legacy parity (74 claim=True cases, runs twice each)
      #   - test_elementwise.py : edge-case structural tests
      #   - test_fallback.py    : permanent CPU fallback and mixed session
      #   - test_claim_diagnostics.py : M0 claim assertion + no-ICD fallback
      # VK_INSTANCE_LAYERS set here (not job level) so the smoke-check above
      # ran without it and got a clean lavapipe baseline.
      # -------------------------------------------------------
      - name: Op-correctness + barrier-parity tests (pytest, lavapipe)
        if: env.BUILD_SKIPPED != '1'
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: |
          export LD_LIBRARY_PATH="$ORT_HOME/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          mkdir -p bench/results/ci-lane
          # The lane marker: written the moment this lane can produce evidence at all.
          # ci/check_device_state.py and ci/check_fatal_log.py both run under always(),
          # so on a lane that died earlier they would otherwise report an instrument
          # error about a subject that never existed and add a second red on top of a
          # failure they did not cause. The marker can only be written by the step that
          # produces the evidence, so it is never absent on a run that did publish.
          touch bench/results/ci-lane/.lane-reached
          # 2>&1: ORT writes `EP_FAIL ... Falling back` from C++ to fd 2. A tee of
          # stdout alone captures a log in which that line cannot appear, and the
          # grep below would then agree with everything (R12: a counter whose event
          # cannot occur in its frame is UNOBSERVABLE, not 0).
          set -o pipefail
          python -m pytest tests/ops -q --tb=short -p no:randomly --strict-markers \
            2>&1 | tee bench/results/ci-lane/pytest-linux.log

      # -------------------------------------------------------
      # CRITERION 10 — the gate this lane did not carry until
      # 2026-07-31, and the reason it needed to.
      #
      # Until now this lane's pass condition was "the pytest
      # process exited zero". On 2026-07-30 that condition held
      # for most of a day while the EP executed ZERO nodes: ORT
      # printed `EP_FAIL ... Falling back to CPUExecutionProvider`
      # inside run(), re-ran the whole graph on CPU, and raised
      # nothing. get_providers() still listed VulkanExecutionProvider
      # because the provider list is fixed at session-create time.
      # The suite was green. Nothing ran on Vulkan.
      #
      # Three steps, deliberately three processes, with three
      # different failure modes (DESIGN.md §10.0.1 R13 obligation 3):
      #   1. produce a verdict record from a right-sized artifact
      #   2. read the record back in a separate process
      #   3. grep the captured suite log for the known-fatal line
      # A guard can crash; a grep cannot NameError. Each covers the
      # other's outage.
      #
      # `continue-on-error` appears on NONE of them, and neither does
      # any verdict-bypass flag. Absence of a check is a refusal, not
      # a default green.
      # -------------------------------------------------------
      - name: Verdict vocabulary preflight (which kind of instrument outage?)
        # Runs BEFORE the gate. Every ci/ check imports its vocabulary from
        # tests/ops/_verdict.py and defines none of its own, so if that module cannot
        # be imported EVERY step below reports ERROR(instrument=...) at once. This step
        # exists so that outcome is readable rather than ambient: it separates "this
        # checkout does not carry the vocabulary" (a repository state; token
        # verdict_vocabulary_absent_from_checkout) from "the file is here and this job
        # cannot load it" (a lane defect; token verdict_vocabulary_broken), prints the
        # module's sha256 and git-tracked status so two lanes can be diffed, and writes
        # the answer to the job summary instead of leaving it in a log.
        if: env.BUILD_SKIPPED != '1'
        run: python ci/check_vocabulary.py --github-summary

      - name: Criterion 10 gate artifact (gate_chain_fp32, lavapipe)
        if: env.BUILD_SKIPPED != '1'
        env:
          ONNXRUNTIME_EP_VULKAN_COUNTERS_FILE: ${{ github.workspace }}/bench/results/ci-lane/counters-linux.json
        run: |
          export LD_LIBRARY_PATH="$ORT_HOME/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          mkdir -p bench/results/ci-lane
          python ci/gate_chain_fp32.py \
            --verdict-out bench/results/ci-lane/verdict-linux.json \
            --workdir bench/results/ci-lane

      - name: Criterion 10 verdict gate (independent reader)
        if: env.BUILD_SKIPPED != '1'
        run: python ci/check_verdict.py bench/results/ci-lane/verdict-linux.json

      - name: Criterion 10 verdict gate (epctl --check-counters)
        if: env.BUILD_SKIPPED != '1'
        run: |
          rust/target/release/epctl --check-counters \
            bench/results/ci-lane/counters-linux.json --require-dispatches 1

      - name: Known-fatal log line is a lane failure (R13 second witness)
        # Runs even when an earlier gate failed: when the EP falls back, the log line
        # is the most legible evidence in the whole lane and it must reach the reader
        # rather than being cancelled by the failure it explains.
        if: env.BUILD_SKIPPED != '1' && always()
        run: |
          python ci/check_fatal_log.py \
            --lane-marker=bench/results/ci-lane/.lane-reached \
            bench/results/ci-lane/pytest-linux.log \
            bench/results/ci-lane/gate_chain_fp32_ort_stderr.log

      # -------------------------------------------------------
      # POSITIVE CONTROL FOR THE GATE ITSELF (R9) — see the Windows
      # lane for the full rationale. Evidence scales only with
      # falsifying instruments: a check observed only to pass is not
      # known to be a check. Remove the ICD, keep everything else
      # identical, and require UNATTRIBUTED.
      # -------------------------------------------------------
      - name: Gate negative control — no ICD must produce UNATTRIBUTED
        if: env.BUILD_SKIPPED != '1'
        env:
          VK_ICD_FILENAMES: /nonexistent/lvp_icd.json
          VK_DRIVER_FILES: /nonexistent/lvp_icd.json
          ONNXRUNTIME_EP_VULKAN_COUNTERS_FILE: ""
        run: |
          export LD_LIBRARY_PATH="$ORT_HOME/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          mkdir -p bench/results/ci-lane
          # Did the suppression take? Linux runners are not elevated so it should, but
          # "should" is what the Windows lane also believed for weeks (PLATFORMS.md
          # §7.4.1). Observed beats assumed, and the record this writes is the artifact
          # that says which of the two this run was (R10).
          set +e
          rust/target/release/epctl --probe-loader > bench/results/ci-lane/icd-probe-report.txt 2>&1
          probe_exit=$?
          set -e
          cat bench/results/ci-lane/icd-probe-report.txt
          set +e
          python ci/check_icd_suppression.py bench/results/ci-lane/icd-probe-report.txt \
            --record-out bench/results/ci-lane/icd-suppression.json \
            --exit-code "$probe_exit"
          icd_state=$?
          set -e
          if [ "$icd_state" -ne 0 ]; then
            # R13: an instrument error is not a detection. The control did not reach its
            # observation, so it asserts nothing either way and must not be reported as a
            # lane failure. The decline-probe control below is loader-independent, is
            # mandatory in this lane too, and cannot be skipped.
            echo "::warning title=ICD-removal negative control did not fire::ERROR(instrument) — see bench/results/ci-lane/icd-suppression.json. This step asserts NOTHING about the gate."
            exit 0
          fi
          set +e
          out=$(python ci/gate_chain_fp32.py \
            --verdict-out bench/results/ci-lane/negative-control.json \
            --workdir bench/results/ci-lane 2>&1)
          code=$?
          set -e
          echo "$out"
          # Quote the text, never the count (R13 second clause).
          if [ "$code" -eq 0 ]; then
            echo "::error::NEGATIVE CONTROL FAILED: the gate passed with no Vulkan ICD present. It cannot distinguish a run that executed from one that did not, so every green in this lane is uninterpretable."
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q 'FAIL(condition=UNATTRIBUTED)'; then
            echo "::error::NEGATIVE CONTROL FAILED: the gate exited $code but did not report FAIL(condition=UNATTRIBUTED). An instrument error is not a detection (R13); a red that could mean either is not a signal."
            exit 1
          fi
          if printf '%s' "$out" | grep -q 'FAIL(condition=DIVERGENT)'; then
            echo "::error::NEGATIVE CONTROL FAILED: UNATTRIBUTED was reported as DIVERGENT. These have different owners and different fixes and must never be folded together."
            exit 1
          fi
          echo "NEGATIVE CONTROL PASSED: with no ICD the gate reported FAIL(condition=UNATTRIBUTED) and exited $code. The gate can fail, so its passes are readable."

      # -------------------------------------------------------
      # SECOND NEGATIVE CONTROL — LOADER-INDEPENDENT (R9).
      #
      # The control above suppresses the ICD. That is a fine control here and an
      # unreliable one on Windows, where the LunarG loader silently ignores
      # VK_DRIVER_FILES/VK_ICD_FILENAMES in elevated processes (PLATFORMS.md §7.4.1)
      # — so a control that depends on it can fail to suppress anything and then
      # report "the gate cannot fail" when what failed was the suppression.
      #
      # This one never touches the loader. `--artifact decline_probe` is a single
      # `Det` node, an op this EP does not implement: the EP loads, the driver is
      # present, the device is real, and the EP still claims nothing, so the graph
      # runs on CPU and the lane must report FAIL(condition=UNATTRIBUTED).
      #
      # It is also the stronger negative. "The EP could not start" and "the EP
      # started and executed nothing" are different failures, and the second is the
      # one that was live on 2026-07-30.
      # -------------------------------------------------------
      - name: Gate negative control — a declined artifact must produce UNATTRIBUTED
        if: env.BUILD_SKIPPED != '1'
        env:
          ONNXRUNTIME_EP_VULKAN_COUNTERS_FILE: ""
        run: |
          export LD_LIBRARY_PATH="$ORT_HOME/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          mkdir -p bench/results/ci-lane
          set +e
          out=$(python ci/gate_chain_fp32.py --artifact decline_probe \
            --verdict-out bench/results/ci-lane/negative-control-decline.json \
            --workdir bench/results/ci-lane 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "::error::NEGATIVE CONTROL FAILED: the gate passed on an artifact the EP is supposed to decline. Either the EP now claims that op — in which case this control has silently stopped being one and must be re-pointed at an op that is still declined — or the gate cannot tell execution from non-execution with the loader healthy, which is worse."
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q 'FAIL(condition=UNATTRIBUTED)'; then
            echo "::error::NEGATIVE CONTROL FAILED: the gate exited $code on the declined artifact but did not report FAIL(condition=UNATTRIBUTED). An instrument error is not a detection (R13)."
            exit 1
          fi
          echo "NEGATIVE CONTROL PASSED (loader untouched): with a healthy EP that claimed nothing, the gate reported FAIL(condition=UNATTRIBUTED) and exited $code."

      # -------------------------------------------------------
      # OBLIGATION 8 — NO LANE MAY PUBLISH A DURATION WITHOUT A
      # DEVICE-STATE RECORD (DESIGN.md §10.0 obligation 8, R9 amdt 5).
      #
      # `gpu_steady_tail()` is a variance test over a suffix, so it
      # cannot see a bias: a board pinned at its 210 MHz idle clock
      # against a 3105 MHz boost is *perfectly steady about a wrong
      # mean*, and the wrong figure carried the BETTER RSD (0.8035% at
      # 10.99x wrong vs 0.8098% correct). A low clock does not raise
      # RSD; it lowers it.
      #
      # No lane quotes a timing figure today. This step is what makes
      # that true by construction rather than by luck: the first lane
      # step that writes a millisecond into an artifact or into the job
      # summary turns this red on the same run.
      #
      # It runs on always() because the state it reports is most
      # interesting on a lane that already failed — a figure published
      # by a broken run is the one most likely to be quoted later.
      # -------------------------------------------------------
      - name: No duration without a device-state record (§10.0 obligation 8)
        if: env.BUILD_SKIPPED != '1' && always()
        run: |
          python ci/check_device_state.py \
            --scan bench/results/ci-lane \
            --lane-marker bench/results/ci-lane/.lane-reached \
            --summary "$GITHUB_STEP_SUMMARY"

      # -------------------------------------------------------
      # The lane's own classification, published as an artifact.
      # `operational` and `green` are different claims: an operational
      # lane runs, a green lane would go RED if the thing it watches
      # broke. Only the second is worth having, and the only evidence
      # that separates them is two arms that differ.
      #
      # This step also refuses to let the inventory rot: every gate
      # step in this workflow must have an entry, because an
      # unclassified step is exactly the state the ICD negative
      # control lived in for weeks — running, reported, never once
      # falsified.
      # -------------------------------------------------------
      - name: Lane inventory - operational vs green
        if: always()
        run: |
          mkdir -p bench/results/ci-lane
          python ci/check_lane_inventory.py \
            --workflow .github/workflows/ci.yml \
            --out bench/results/ci-lane/lane-inventory.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-evidence-linux
          path: bench/results/ci-lane/
          if-no-files-found: warn

  # ----------------------------------------------------------------
  # 3. Windows: build + clippy + op tests (lavapipe via mesa-dist-win)
  # ----------------------------------------------------------------
  # FINDING (2026-07-28): lavapipe IS available on Windows CI.
  #   Mesa ships Windows lavapipe builds via mesa-dist-win:
  #   https://github.com/pal1000/mesa-dist-win
  #   The MSVC release (mesa3d-{ver}-release-msvc.7z) ships the
  #   lavapipe ICD DLL + JSON. 7-zip is available on windows-latest.
  #   Validation layers come from the LunarG Vulkan SDK already
  #   installed for glslc/headers; VK_LAYER_PATH = $VULKAN_SDK\Bin.
  #
  #   SwiftShader was also investigated: Google does not publish
  #   prebuilt Windows binaries (only source); building from source
  #   requires cmake + clang (~20 min). mesa-dist-win lavapipe is
  #   the better Windows software-rasterizer for CI.
  #   Reported to docs/PLATFORMS.md §7.4 (Link owns that file).
  # ----------------------------------------------------------------
  build-test-windows:
    name: Build + op tests (Windows, lavapipe via mesa-dist-win)
    runs-on: windows-latest
    env:
      # VK_ICD_FILENAMES set in the lavapipe step (for non-elevated sub-processes).
      # For the elevated runner itself, ICD is registered via HKLM registry —
      # loader 1.3+ ignores VK_ICD_FILENAMES/VK_DRIVER_FILES on elevated processes.
      # Source: docs/PLATFORMS.md §7.4.1 root cause analysis (Link).
      ONNXRUNTIME_EP_VULKAN_VALIDATE: "1"
      # VK_INSTANCE_LAYERS moved to the pytest step (same rationale as Linux).
      VK_LOADER_DEBUG: warn

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (rustup, no third-party action)
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      # -------------------------------------------------------
      # LunarG Vulkan SDK: provides vulkan.h (for ash), glslc,
      # and validation layer headers. The installer sets VULKAN_SDK.
      # -------------------------------------------------------
      - name: Install LunarG Vulkan SDK
        run: |
          $ver = "$env:VULKAN_SDK_VERSION"
          $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe"
          Write-Host "Downloading Vulkan SDK $ver from $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\VulkanSDK.exe"
          Start-Process -Wait -FilePath "$env:TEMP\VulkanSDK.exe" `
            -ArgumentList '--accept-licenses', '--default-answer', '--confirm-command', 'install'
          $sdkPath = "C:\VulkanSDK\$ver"
          echo "VULKAN_SDK=$sdkPath" >> $env:GITHUB_ENV
          echo "$sdkPath\Bin" >> $env:GITHUB_PATH
          Write-Host "Vulkan SDK installed at $sdkPath"

      # -------------------------------------------------------
      # ONNX Runtime: download the prebuilt Windows x64 zip.
      # -------------------------------------------------------
      - name: Provision ONNX Runtime ${{ env.ORT_VERSION }}
        run: |
          $ver = "$env:ORT_VERSION"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$ver/onnxruntime-win-x64-$ver.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\ort.zip"
          Expand-Archive -Path "$env:TEMP\ort.zip" -DestinationPath "$env:GITHUB_WORKSPACE"
          $ortHome = "$env:GITHUB_WORKSPACE\onnxruntime-win-x64-$ver"
          echo "ORT_HOME=$ortHome" >> $env:GITHUB_ENV

      # -------------------------------------------------------
      # Build: warns if crate not yet landed.
      # -------------------------------------------------------
      - name: Build Vulkan EP (cargo build --release)
        run: |
          if (-not (Test-Path "rust\Cargo.toml")) {
            Write-Host "::warning::rust\Cargo.toml not found — EP crate not yet landed (Tank's work in progress)"
            echo "BUILD_SKIPPED=1" >> $env:GITHUB_ENV
            exit 0
          }
          $env:ORT_INCLUDE_DIR = "$env:ORT_HOME\include"
          $env:RUSTFLAGS = "-D warnings"
          cargo build --release --manifest-path rust\Cargo.toml
          if (-not (Test-Path "rust\target\release\onnxruntime_vulkan_ep.dll")) {
            Write-Error "cdylib not found after build — check [lib] crate-type in Cargo.toml"
            exit 1
          }

      - name: Clippy (all warnings as errors)
        if: env.BUILD_SKIPPED != '1'
        run: |
          $env:ORT_INCLUDE_DIR = "$env:ORT_HOME\include"
          cargo clippy --release --manifest-path rust\Cargo.toml `
            --all-targets -- -D warnings

      # -------------------------------------------------------
      # Rust unit tests and the four integration targets CI never ran.
      # Before 2026-08-01 this lane ran NO cargo test at all — not even
      # the layering lint. The 440 unit tests include the only
      # host-independent falsifier for the timestampPeriod defect
      # class: lavapipe reports period 1.0 exactly as NVIDIA does, so
      # a build that drops the conversion is invisible to every device
      # CI can reach and under-reports Intel Iris Xe by 52.0833x.
      # See ci/lane_inventory.py :: BLIND_SPOTS['timestamp_period_52x'].
      # -------------------------------------------------------
      - name: Rust unit tests (cargo test --lib)
        if: env.BUILD_SKIPPED != '1'
        run: |
          $env:ORT_INCLUDE_DIR = "$env:ORT_HOME\include"
          cargo test --lib --release --manifest-path rust\Cargo.toml
          exit $LASTEXITCODE

      - name: Portability lint (cargo test --test portability)
        if: env.BUILD_SKIPPED != '1'
        run: |
          $env:ORT_INCLUDE_DIR = "$env:ORT_HOME\include"
          cargo test --test portability --release --manifest-path rust\Cargo.toml
          exit $LASTEXITCODE

      - name: Layering lint (cargo test --test layering)
        if: env.BUILD_SKIPPED != '1'
        run: |
          $env:ORT_INCLUDE_DIR = "$env:ORT_HOME\include"
          cargo test --test layering --release --manifest-path rust\Cargo.toml
          exit $LASTEXITCODE

      - name: Remaining integration targets (cdylib_load, dump_capabilities, host_registration, validation_control)
        if: env.BUILD_SKIPPED != '1'
        run: |
          $env:ORT_INCLUDE_DIR = "$env:ORT_HOME\include"
          cargo test --release --manifest-path rust\Cargo.toml `
            --test cdylib_load --test dump_capabilities `
            --test host_registration --test validation_control
          exit $LASTEXITCODE

      # -------------------------------------------------------
      # Mesa lavapipe ICD (Windows, mesa-dist-win).
      # Installs the CPU-only Vulkan 1.3 software rasterizer so
      # correctness tests can run without a real GPU on windows-latest.
      #
      # SwiftShader was also investigated: Google does not publish
      # prebuilt Windows binaries; building from source requires
      # cmake + clang (~20 min) — too costly for routine PR CI.
      # mesa-dist-win lavapipe (MSVC release, ~69 MB) is the right
      # Windows software ICD. Finding reported to docs/PLATFORMS.md
      # §7.4 (Link owns that file; we do not edit it here).
      #
      # Package contents: x64\ with lavapipe DLL + lvp_icd*.json.
      # 7z is available on windows-latest runners.
      # VK_LAYER_PATH is set to $VULKAN_SDK\Bin so the already-
      # installed LunarG validation layers are found by the loader.
      # -------------------------------------------------------
      - name: Install Mesa lavapipe (mesa-dist-win ${{ env.MESA_VERSION }})
        run: |
          $ver = "$env:MESA_VERSION"
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$ver/mesa3d-$ver-release-msvc.7z"
          $archive = "$env:GITHUB_WORKSPACE\mesa3d.7z"
          $dest    = "$env:GITHUB_WORKSPACE\mesa3d"
          Write-Host "Downloading Mesa $ver from $url"
          Invoke-WebRequest -Uri $url -OutFile $archive
          & 7z x $archive "-o$dest" -y | Out-Null
          # Locate the lavapipe ICD JSON — Mesa names it lvp_icd*.json
          $icdJson = Get-ChildItem -Recurse -Path $dest -Filter "lvp_icd*.json" |
                     Sort-Object FullName | Select-Object -First 1
          if (-not $icdJson) {
            # Dump the extracted tree so the maintainer can see the real layout
            Get-ChildItem -Recurse $dest | Select-Object FullName
            Write-Error "lavapipe ICD JSON not found — check mesa-dist-win package structure"
            exit 1
          }
          Write-Host "Found lavapipe ICD: $($icdJson.FullName)"
          echo "VK_ICD_FILENAMES=$($icdJson.FullName)"  >> $env:GITHUB_ENV
          # Add the DLL directory to PATH so vkCreateInstance finds vulkan_lvp.dll
          echo "$($icdJson.DirectoryName)" >> $env:GITHUB_PATH
          # Validation layers live in the LunarG SDK Bin folder
          echo "VK_LAYER_PATH=$env:VULKAN_SDK\Bin" >> $env:GITHUB_ENV

          # -------------------------------------------------------
          # Register ICD in Windows registry.
          # The LunarG loader 1.3+ silently ignores VK_ICD_FILENAMES and
          # VK_DRIVER_FILES on elevated processes (Administrator / runneradmin
          # with UAC disabled). Registry-based ICD discovery under
          # HKLM:\SOFTWARE\Khronos\Vulkan\Drivers works regardless of elevation.
          # Source: docs/PLATFORMS.md §7.4.1 root cause analysis (Link).
          # -------------------------------------------------------
          $icdPath = $icdJson.FullName
          $driverKey = "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers"
          New-Item -Path $driverKey -Force | Out-Null
          New-ItemProperty -Path $driverKey -Name $icdPath -Value 0 -PropertyType DWord -Force | Out-Null
          Write-Host "Registered Mesa lavapipe ICD in registry: $icdPath"

          # -------------------------------------------------------
          # Smoke-check: lavapipe must enumerate before we waste build time.
          # Use vulkaninfoSDK.exe (from LunarG SDK) with VK_LOADER_DEBUG=warn.
          # Hard failure if 'llvmpipe' is not in the output.
          # -------------------------------------------------------
          $env:MESA_LOG_LEVEL = "error"
          $vulkInfo = & "$env:VULKAN_SDK\Bin\vulkaninfoSDK.exe" --summary 2>&1
          Write-Host $vulkInfo
          if (-not ($vulkInfo | Select-String -Quiet -SimpleMatch "llvmpipe")) {
            Write-Error "lavapipe (llvmpipe) not found in vulkaninfo output after registry registration. Check HKLM:\SOFTWARE\Khronos\Vulkan\Drivers and mesa3d\x64\ DLL path."
            exit 1
          }
          Write-Host "lavapipe smoke-check: OK (llvmpipe enumerated)"

      # -------------------------------------------------------
      # Python test environment
      # -------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: pip install -r tests/requirements.txt

      # -------------------------------------------------------
      # Probe Vulkan loader — same as Linux lane.
      # Hard failure if no capable device after registry registration.
      # -------------------------------------------------------
      - name: Probe Vulkan loader (epctl --probe-loader)
        if: env.BUILD_SKIPPED != '1'
        run: rust\target\release\epctl.exe --probe-loader

      # -------------------------------------------------------
      # Op-correctness + barrier-parity tests (pytest, lavapipe).
      # VK_INSTANCE_LAYERS set here (not job level) — same rationale as Linux.
      # ORT DLL on PATH so the EP DLL resolves onnxruntime.dll at load time.
      # -------------------------------------------------------
      - name: Run op-correctness + barrier-parity tests (lavapipe)
        if: env.BUILD_SKIPPED != '1'
        env:
          ONNXRUNTIME_VULKAN_EP_LIB: ${{ github.workspace }}\rust\target\release\onnxruntime_vulkan_ep.dll
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: |
          $env:PATH = "$env:ORT_HOME\lib;$env:PATH"
          New-Item -ItemType Directory -Force -Path bench\results\ci-lane | Out-Null
          # The lane marker: written the moment this lane can produce evidence at all,
          # so the always() checks downstream can tell "the lane published no duration"
          # from "the lane died before it could publish anything". Only the marker's
          # producer can write it, so it is never absent on a run that did publish.
          New-Item -ItemType File -Force -Path bench\results\ci-lane\.lane-reached | Out-Null
          # 2>&1 merges ORT's native stderr, where `EP_FAIL ... Falling back` is
          # written. Without it the grep step scans a log in which its own subject
          # cannot appear.
          python -m pytest tests\ops -q --tb=short `
            -p no:randomly --strict-markers 2>&1 |
            Tee-Object -FilePath bench\results\ci-lane\pytest-windows.log
          exit $LASTEXITCODE

      # -------------------------------------------------------
      # CRITERION 10 — see the Linux lane for the full rationale.
      # Same three steps, same three failure modes, same absence
      # of any verdict-bypass escape.
      # -------------------------------------------------------
      - name: Verdict vocabulary preflight (which kind of instrument outage?)
        # See the Linux lane. Separates "this checkout does not carry
        # tests/ops/_verdict.py" (repository state) from "the file is here and this job
        # cannot import it" (lane defect) — two situations that otherwise produce the
        # identical ERROR(instrument=verdict_vocabulary_unavailable) in every step below.
        if: env.BUILD_SKIPPED != '1'
        run: |
          python ci\check_vocabulary.py --github-summary
          exit $LASTEXITCODE

      - name: Criterion 10 gate artifact (gate_chain_fp32, lavapipe)
        if: env.BUILD_SKIPPED != '1'
        env:
          ONNXRUNTIME_VULKAN_EP_LIB: ${{ github.workspace }}\rust\target\release\onnxruntime_vulkan_ep.dll
          ONNXRUNTIME_EP_VULKAN_COUNTERS_FILE: ${{ github.workspace }}\bench\results\ci-lane\counters-windows.json
        run: |
          $env:PATH = "$env:ORT_HOME\lib;$env:PATH"
          New-Item -ItemType Directory -Force -Path bench\results\ci-lane | Out-Null
          python ci\gate_chain_fp32.py `
            --verdict-out bench\results\ci-lane\verdict-windows.json `
            --workdir bench\results\ci-lane
          exit $LASTEXITCODE

      - name: Criterion 10 verdict gate (independent reader)
        if: env.BUILD_SKIPPED != '1'
        run: |
          python ci\check_verdict.py bench\results\ci-lane\verdict-windows.json
          exit $LASTEXITCODE

      - name: Criterion 10 verdict gate (epctl --check-counters)
        if: env.BUILD_SKIPPED != '1'
        run: |
          rust\target\release\epctl.exe --check-counters `
            bench\results\ci-lane\counters-windows.json --require-dispatches 1
          exit $LASTEXITCODE

      - name: Known-fatal log line is a lane failure (R13 second witness)
        if: env.BUILD_SKIPPED != '1' && always()
        run: |
          python ci\check_fatal_log.py `
            --lane-marker=bench\results\ci-lane\.lane-reached `
            bench\results\ci-lane\pytest-windows.log `
            bench\results\ci-lane\gate_chain_fp32_ort_stderr.log
          exit $LASTEXITCODE

      # -------------------------------------------------------
      # No-ICD fallback test (always runs, even without a build).
      # Proves: zero devices advertised → session falls back to CPU
      # gracefully. M0 exit criterion, Windows-specific coverage.
      # Overrides VK_ICD_FILENAMES to a nonexistent path, so the
      # Vulkan loader returns zero devices regardless of lavapipe.
      # -------------------------------------------------------
      - name: Run no-ICD fallback test
        run: |
          $env:VK_ICD_FILENAMES = "C:\nonexistent\lvp_icd.json"
          $env:VK_DRIVER_FILES  = "C:\nonexistent\lvp_icd.json"
          if (Test-Path "rust\target\release\onnxruntime_vulkan_ep.dll") {
            $env:ONNXRUNTIME_VULKAN_EP_LIB = "$env:GITHUB_WORKSPACE\rust\target\release\onnxruntime_vulkan_ep.dll"
          }
          python -m pytest tests\ops\test_claim_diagnostics.py::test_no_vulkan_icd_falls_back_to_cpu `
            -q --tb=short

      # -------------------------------------------------------
      # POSITIVE CONTROL FOR THE GATE ITSELF (R9).
      #
      # Evidence scales only with falsifying instruments. The three
      # gate steps above have, on a healthy run, only ever been
      # observed to pass — and a check observed only to pass is not
      # known to be a check. This step removes the ICD, so the EP
      # can execute nothing, and requires the gate to say so.
      #
      # It is the cheapest available proof that a green lane above
      # means something: the SAME artifact, the SAME script, one
      # environment variable different, and it must come back
      # UNATTRIBUTED with a non-zero exit. If this step ever passes
      # silently, every green in this lane is uninterpretable.
      #
      # UNATTRIBUTED and not DIVERGENT, asserted by name: the model
      # was not wrong, the subject was absent (§10.0 clause 4).
      # -------------------------------------------------------
      - name: Gate negative control — no ICD must produce UNATTRIBUTED
        if: env.BUILD_SKIPPED != '1'
        env:
          ONNXRUNTIME_VULKAN_EP_LIB: ${{ github.workspace }}\rust\target\release\onnxruntime_vulkan_ep.dll
        run: |
          $env:PATH = "$env:ORT_HOME\lib;$env:PATH"
          $env:VK_ICD_FILENAMES = "C:\nonexistent\lvp_icd.json"
          $env:VK_DRIVER_FILES  = "C:\nonexistent\lvp_icd.json"
          $env:ONNXRUNTIME_EP_VULKAN_COUNTERS_FILE = ""
          New-Item -ItemType Directory -Force -Path bench\results\ci-lane | Out-Null
          # ---------------------------------------------------------------
          # FIRST: did the suppression take? On Windows this is a real
          # question, not a formality. PLATFORMS.md §7.4.1: the LunarG
          # loader SILENTLY IGNORES VK_DRIVER_FILES/VK_ICD_FILENAMES in
          # elevated processes, and GitHub's Windows runners are elevated —
          # which is exactly why this lane registers lavapipe in the
          # registry instead. If the ICD is still there, the gate will
          # execute and pass, and reporting that as "the gate cannot fail"
          # would blame the gate for a control that never fired. That is a
          # real detection's costume on an instrument outage, and it routes
          # the finding to the wrong owner (R13).
          #
          # This used to be an inline `-match 'passed the §7.2 capability
          # gate'`, and that test was ALWAYS TRUE: the report line reads
          # "{n} device(s) passed the §7.2 capability gate." and n is 0 when
          # the suppression DID take. So the short-circuit fired on every
          # run and this control has never once been exercised. A detector
          # that fires on every input is a constant, not a detector. The
          # count is the discriminator, so ci/check_icd_suppression.py
          # parses the count, has two-polarity tests, and writes a record
          # whose content varies with its input (R10) instead of an
          # annotation that leaves no artifact.
          # ---------------------------------------------------------------
          rust\target\release\epctl.exe --probe-loader *> bench\results\ci-lane\icd-probe-report.txt
          $probeExit = $LASTEXITCODE
          Get-Content bench\results\ci-lane\icd-probe-report.txt
          python ci\check_icd_suppression.py bench\results\ci-lane\icd-probe-report.txt `
            --record-out bench\results\ci-lane\icd-suppression.json `
            --exit-code $probeExit
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning title=ICD-removal negative control did not fire::ERROR(instrument) — see bench/results/ci-lane/icd-suppression.json. This step asserts NOTHING about the gate: it did not reach its observation. The gate's falsifier on this lane is the loader-independent decline-probe control in the next step, which is mandatory and cannot be skipped."
            exit 0
          }
          $out = python ci\gate_chain_fp32.py `
            --verdict-out bench\results\ci-lane\negative-control.json `
            --workdir bench\results\ci-lane 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          # Quote the text, never the count (R13 second clause): the assertion is on
          # the token the gate printed, not on how many things went wrong.
          if ($code -eq 0) {
            Write-Error "NEGATIVE CONTROL FAILED: the gate passed with no Vulkan ICD present. It cannot distinguish a run that executed from one that did not, so every green in this lane is uninterpretable."
            exit 1
          }
          if ($out -notmatch 'FAIL\(condition=UNATTRIBUTED\)') {
            Write-Error "NEGATIVE CONTROL FAILED: the gate exited $code but did not report FAIL(condition=UNATTRIBUTED). An instrument error is not a detection (R13); a red that could mean either is not a signal."
            exit 1
          }
          if ($out -match 'FAIL\(condition=DIVERGENT\)') {
            Write-Error "NEGATIVE CONTROL FAILED: UNATTRIBUTED was reported as DIVERGENT. These have different owners and different fixes and must never be folded together."
            exit 1
          }
          Write-Host "NEGATIVE CONTROL PASSED: with no ICD the gate reported FAIL(condition=UNATTRIBUTED) and exited $code. The gate can fail, so its passes are readable."

      # -------------------------------------------------------
      # THE FALSIFIER THIS LANE ACTUALLY RELIES ON.
      #
      # Loader-independent, so it fires on an elevated runner where the
      # step above cannot. `--artifact decline_probe` is a single `Det`
      # node — an op this EP does not implement. The EP loads, lavapipe
      # is present, the device passes the §7.2 gate, and the EP still
      # claims nothing: the graph runs on CPU and the lane must report
      # FAIL(condition=UNATTRIBUTED).
      #
      # This is the stronger negative of the two. "The EP could not
      # start" and "the EP started and executed nothing" are different
      # failures; the second is the one that was live on 2026-07-30 and
      # the one a green lane hid.
      # -------------------------------------------------------
      - name: Gate negative control — a declined artifact must produce UNATTRIBUTED
        if: env.BUILD_SKIPPED != '1'
        env:
          ONNXRUNTIME_VULKAN_EP_LIB: ${{ github.workspace }}\rust\target\release\onnxruntime_vulkan_ep.dll
          ONNXRUNTIME_EP_VULKAN_COUNTERS_FILE: ""
        run: |
          $env:PATH = "$env:ORT_HOME\lib;$env:PATH"
          New-Item -ItemType Directory -Force -Path bench\results\ci-lane | Out-Null
          $out = python ci\gate_chain_fp32.py --artifact decline_probe `
            --verdict-out bench\results\ci-lane\negative-control-decline.json `
            --workdir bench\results\ci-lane 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -eq 0) {
            Write-Error "NEGATIVE CONTROL FAILED: the gate passed on an artifact the EP is supposed to decline. Either the EP now claims that op — in which case this control has silently stopped being one and must be re-pointed at an op that is still declined — or the gate cannot tell execution from non-execution with the loader healthy, which is worse."
            exit 1
          }
          if ($out -notmatch 'FAIL\(condition=UNATTRIBUTED\)') {
            Write-Error "NEGATIVE CONTROL FAILED: the gate exited $code on the declined artifact but did not report FAIL(condition=UNATTRIBUTED). An instrument error is not a detection (R13)."
            exit 1
          }
          Write-Host "NEGATIVE CONTROL PASSED (loader untouched): with a healthy EP that claimed nothing, the gate reported FAIL(condition=UNATTRIBUTED) and exited $code."

      # -------------------------------------------------------
      # OBLIGATION 8 — see the Linux lane for the full rationale.
      # A duration published without a device-state record covering the
      # statistic's own suffix is STEADY_UNCERTIFIED; on a host with no
      # producer at all it is ERROR(instrument), never a pass, because
      # "no telemetry therefore no requirement" makes the cheapest pass
      # a platform that cannot be audited — and a CI runner with no GPU
      # telemetry is that loophole at scale.
      # -------------------------------------------------------
      - name: No duration without a device-state record (§10.0 obligation 8)
        if: env.BUILD_SKIPPED != '1' && always()
        run: |
          python ci\check_device_state.py `
            --scan bench\results\ci-lane `
            --lane-marker bench\results\ci-lane\.lane-reached `
            --summary "$env:GITHUB_STEP_SUMMARY"

      - name: Lane inventory - operational vs green
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path bench\results\ci-lane | Out-Null
          python ci\check_lane_inventory.py `
            --workflow .github/workflows/ci.yml `
            --out bench\results\ci-lane\lane-inventory.json `
            --summary "$env:GITHUB_STEP_SUMMARY"
          exit $LASTEXITCODE

      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-evidence-windows
          path: bench/results/ci-lane/
          if-no-files-found: warn
